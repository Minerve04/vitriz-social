name: Rendre les visuels VITRIZ
on:
  push:
    paths: ["a-publier/*.html", "tools/rendre.py", "fonts/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: rendre
jobs:
  rendre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/rendre.py
      - run: |
          git config user.name "vitriz-bot"
          git config user.email "thomas@minerve.ai"
          git add a-publier/*.jpg 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Visuels rendus" && git pull --rebase && git push)
