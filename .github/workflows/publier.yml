name: Publier le post VITRIZ
on:
  schedule:
    - cron: "30 10 * * 1,3,5"   # 11 h 30 à Paris en hiver (12 h 30 en été)
  workflow_dispatch:
permissions:
  contents: write
concurrency: publier
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          git config user.name "vitriz-bot"
          git config user.email "thomas@minerve.ai"
          python tools/publier.py
        env:
          VITRIZ_WEBHOOK_URL: ${{ secrets.VITRIZ_WEBHOOK_URL }}
          VITRIZ_WEBHOOK_TOKEN: ${{ secrets.VITRIZ_WEBHOOK_TOKEN }}
