name: Rapatrier les images de vitriz.fr
on:
  push:
    paths: ["assets/sources.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd assets
          while read -r name url; do [ -n "$name" ] && curl -fsSL -A "Mozilla/5.0" -o "$name" "$url"; done < sources.txt
          ls -la
      - run: |
          git config user.name "vitriz-bot"
          git config user.email "thomas@minerve.ai"
          git add assets
          git diff --cached --quiet || (git commit -m "Images de vitriz.fr" && git pull --rebase && git push)
